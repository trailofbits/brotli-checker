name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: uv sync --locked
      - name: Check formatting, lint, and types
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check skills/brotli-checker/scripts scripts tests
      - name: Run offline tests
        run: uv run --locked pytest

  node-fetch:
    name: Built-in Node fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check benign Brotli response decoding
        run: make verify-node-fetch
