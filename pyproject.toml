[project]
name = "brotli-checker"
version = "0.1.0"
description = "A Brotli security checker skill and offline source inventory tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
dependencies = []

[tool.uv]
# Explicitly override any user-level waiting period for reviewed updates.
exclude-newer = "0 days"

[project.urls]
Repository = "https://github.com/trailofbits/brotli-checker"
Issues = "https://github.com/trailofbits/brotli-checker/issues"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # Public behavior is documented in the skill and README.
    "COM812",  # Let the formatter manage trailing commas.
    "ISC001",  # Let the formatter manage string wrapping.
    "CPY001",  # The repository does not mandate per-file copyright headers.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ANN", "INP001"]
"**/scripts/*.py" = ["T201", "INP001"]  # Standalone command-line scripts.

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["skills/brotli-checker/scripts", "scripts"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/brotli-checker/scripts", "scripts"]
addopts = ["--strict-config", "--strict-markers", "--cov", "--cov-report=term-missing"]
filterwarnings = [
    "error",
    # The gremlins coverage launcher imports its package before pytest starts.
    "ignore:Module already imported so cannot be rewritten; pytest_gremlins:pytest.PytestAssertRewriteWarning",
]

[tool.pytest-gremlins]
paths = ["skills/brotli-checker/scripts"]
workers = 2
cache = false
report = ["json", "html"]
coverage_timeout = 120
mutant_timeout = 10
max_pardons = 2  # Only the two standalone CLI bootstrap guards; checked again in CI.

[tool.coverage.run]
branch = true
source = ["skills/brotli-checker/scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["^if __name__ =="]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
security = ["pip-audit>=2.10.1", "zizmor>=1.31.1"]
mutation = ["pytest-gremlins>=1.12.2"]
