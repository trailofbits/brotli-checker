name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python-version }}
      - name: Install development tools
        run: uv sync --locked --extra flirt --extra analysis
      - name: Check formatting, lint, and types
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check skills/brotli-checker/scripts scripts tests
      - name: Run offline tests
        run: uv run --locked --extra flirt --extra analysis pytest
      - name: Validate packaged FLIRT corpus
        if: matrix.python-version == '3.12'
        env:
          BROTLI_FLIRT_REFERENCE_TESTS: '1'
        run: uv run --locked --extra flirt --extra analysis pytest tests/test_flirt_packaged.py --no-cov

  macos:
    name: Python 3.12 (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - name: Run portable offline tests
        run: uv run --locked --extra flirt --extra analysis pytest

  trailmark:
    name: Trailmark source discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - name: Run real parser integration tests
        env:
          BROTLI_TRAILMARK_TESTS: '1'
        run: uv run --locked pytest tests/test_source_discovery.py --no-cov

  node-fetch:
    name: Built-in Node fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check benign Brotli response decoding
        run: make verify-node-fetch

  mutation:
    name: Mutations (${{ matrix.module }}/${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: brotli_analysis
            shard: all
          - module: brotli_binary_data
            shard: all
          - module: brotli_binary_graph
            shard: comparison
          - module: brotli_binary_graph
            shard: arithmetic-boundary
          - module: brotli_binary_graph
            shard: boolean-return
          - module: brotli_binary_inventory
            shard: all
          - module: brotli_binary_layout
            shard: comparison
          - module: brotli_binary_layout
            shard: arithmetic-boundary
          - module: brotli_binary_layout
            shard: boolean-return
          - module: brotli_binary_match
            shard: all
          - module: brotli_binary_metadata
            shard: all
          - module: brotli_binary_signatures
            shard: all
          - module: brotli_binary_triage
            shard: all
          - module: brotli_debug_companions
            shard: comparison
          - module: brotli_debug_companions
            shard: arithmetic-boundary
          - module: brotli_debug_companions
            shard: boolean-return
          - module: brotli_dependencies
            shard: all
          - module: brotli_evidence_report
            shard: all
          - module: brotli_flirt
            shard: all
          - module: brotli_inventory
            shard: comparison
          - module: brotli_inventory
            shard: arithmetic-boundary
          - module: brotli_inventory
            shard: boolean-return
          - module: brotli_package_provenance
            shard: comparison
          - module: brotli_package_provenance
            shard: arithmetic-boundary
          - module: brotli_package_provenance
            shard: boolean-return
          - module: brotli_payloads
            shard: comparison
          - module: brotli_payloads
            shard: arithmetic-boundary
          - module: brotli_payloads
            shard: boolean-return
          - module: brotli_provenance
            shard: all
          - module: brotli_providers
            shard: all
          - module: brotli_report_finalizer
            shard: all
          - module: brotli_reporting_cli
            shard: all
          - module: brotli_source_discovery
            shard: all
          - module: brotli_source_leads
            shard: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
      - name: Run module mutation tests
        env:
          MUTATION_MODULE: ${{ matrix.module }}
          MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          make known-answers
          uv run --locked --extra flirt --extra analysis --group mutation python scripts/run_mutation_shard.py "$MUTATION_MODULE" "$MUTATION_SHARD"
      - name: Retain mutation evidence
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-mutation-${{ matrix.module }}-${{ matrix.shard }}
          path: coverage/gremlins/
          if-no-files-found: error
          retention-days: 14

  mutation-gate:
    name: Scanner mutation tests
    needs: mutation
    permissions:
      contents: read
      actions: read # Download mutation artifacts from this workflow run.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every shard to finish
        env:
          SHARD_RESULT: ${{ needs.mutation.result }}
        run: test "$SHARD_RESULT" = success
      - name: Download per-module results
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --pattern 'scanner-mutation-*' --dir mutation-reports
      - name: Enforce complete aggregate score
        run: python3 scripts/check_mutation_score.py mutation-reports/*/gremlins.json
